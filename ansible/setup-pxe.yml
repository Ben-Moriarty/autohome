- name: Setting up PXE server for autohome deploy
  hosts: deb_vm
  become: true
  tasks:
    - name: download proxmox keyring
      ansible.builtin.get_url:
        url: https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
        dest: /usr/share/keyrings/proxmox-archive-keyring.gpg

    - name: setup proxmox apt repo
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/proxmox.sources
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: trixie
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
        remote_src: true

    - name: install packages
      ansible.builtin.apt:
        update_cache: yes
        name:
          - proxmox-auto-install-assistant 
          - ipxe
          - git
          - caddy
          - dnsmasq
        state: latest

    - name: clone repo
      ansible.builtin.git:
        repo: 'http://192.168.0.63:3000/noche/autohome.git'
        dest: "/home/{{ ansible_user }}/proxmox-pxe-boot/"

    - name: setup caddy
      ansible.builtin.copy:
        dest: /etc/caddy/Caddyfile
        content: |
          :8000 {
            log {
              output file /var/log/caddy/caddy.log
            }
            root * "/home/{{ ansible_user }}/proxmox-pxe-boot/http/"
            file_server browse
          }
        remote_src: true
      notify: reload caddy
    
    - name: setup dnsmasq
      ansible.builtin.copy:
        dest: /etc/dnsmasq.conf
        content: |
          port=0
          dhcp-range=192.168.0.0,proxy
          pxe-service=tag:!ipxe,x86-64_EFI,"EFI network boot",ipxe.efi
          pxe-service=tag:ipxe,x86-64_EFI,"iPXE",proxmox.ipxe
          dhcp-userclass=set:ipxe,iPXE
          enable-tftp
          tftp-root="/home/{{ ansible_user }}/proxmox-pxe-boot/pxe/tftp"
          log-queries
          log-dhcp
          log-facility=/var/log/dnsmasq.log
        remote_src: true
      notify: reload dnsmasq
    
    - name: flush handlers
      ansible.builtin.meta: flush_handlers
    
    - name: download iso
      ansible.builtin.get_url:
        url: https://enterprise.proxmox.com/iso/proxmox-ve_9.2-1.iso
        dest: "/home/{{ ansible_user }}/proxmox-pxe-boot/proxmox-ve_9.2-1.iso"
        checksum: sha256:4e88fe416df9b527624a175f24c9aa07c714d3332afb1ee3dbf3879573ef2c6c
    
    - name: prep iso
      ansible.builtin.command:
        argv: 
          - proxmox-auto-install-assistant 
          - prepare-iso 
          - "/home/{{ ansible_user }}/proxmox-pxe-boot/proxmox-ve_9.2-1.iso" 
          - --fetch-from http 
          - --url 
          - "http://192.168.0.18/answer.toml" 
          - --pxe 
          - --output 
          - "/home/{{ ansible_user }}/proxmox-pxe-boot/http/"
        creates: "/home/{{ ansible_user }}/proxmox-pxe-boot/http/initrd.img"

    - name: create answerfile
      ansible.builtin.copy:
        dest: "/home/{{ ansible_user }}/proxmox-pxe-boot/pxe/http/answer.toml"
        content: |
          [global]
          keyboard = "en-us"
          country = "us"
          fqdn = "nocheprox.nochemox"
          mailto = "mail@no.invalid"
          timezone = "America/Phoenix"
          root-password = "Siddhartha314!"

          [network]
          source = "from-dhcp"

          [network.interface-name-pinning]
          enabled = true

          [disk-setup]
          filesystem = "zfs"
          zfs.raid = "raid0"
          disk-list = ["sda"]
        remote_src: true

    - name: copy ipxe
      ansible.builtin.copy:
        src: '/usr/lib/ipxe/ipxe-amd64.efi'
        dest: "/home/{{ ansible_user }}/proxmox-pxe-boot/pxe/tftp/"
        remote_src: true
    
    - name: ipxe conf
      ansible.builtin.copy:
        dest: "/home/{{ ansible_user }}/proxmox-pxe-boot/tftp"
        content: |
          #!ipxe
          set base http://192.168.0.18:8000
          kernel ${base}/vmlinuz splash=silent proxmox-start-auto-installer
          initrd ${base}/initrd.img
          initrd ${base}/proxmox-ve_9.2-1-auto-from-http-url.iso proxmox.iso
          boot
        remote_src: true

  handlers:
    - name: reload caddy
      ansible.builtin.service:
        name: caddy
        state: reloaded

    - name: reload dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        state: reloaded