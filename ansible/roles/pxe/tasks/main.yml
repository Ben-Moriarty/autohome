- name: Download proxmox keyring
  ansible.builtin.get_url:
    url: https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
    dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
    mode: "0644"
    owner: root
    group: root

- name: Setup proxmox apt repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: trixie
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    mode: "0644"
    owner: root
    group: root
    remote_src: true

- name: Install packages
  ansible.builtin.apt:
    name:
      - proxmox-auto-install-assistant
      - ipxe
      - git
      - caddy
      - dnsmasq
      - acl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Clone repo
  ansible.builtin.git:
    repo: 'http://192.168.0.63:3000/noche/autohome.git'
    dest: "/home/{{ ansible_user }}/proxmox-pxe-boot/"
    version: master

- name: Setup caddy
  ansible.builtin.copy:
    dest: /etc/caddy/Caddyfile
    content: |
      :8000 {
        log {
          output file /var/log/caddy/caddy.log
        }
        root * "/home/{{ ansible_user }}/proxmox-pxe-boot/pxe/http/"
        file_server browse
      }
    group: caddy
    mode: "0640"
    remote_src: true
  notify: Reload caddy

- name: Caddy acl
  ansible.posix.acl:
    path: "/home/{{ ansible_user }}"
    entity: caddy
    etype: group
    permissions: x
    state: present

- name: Caddy rx acl
  ansible.posix.acl:
    path: "/home/{{ ansible_user }}/proxmox-pxe-boot"
    entity: caddy
    etype: group
    permissions: rx
    recursive: true
    state: present

- name: Setup dnsmasq
  ansible.builtin.copy:
    dest: /etc/dnsmasq.conf
    content: |
      port=0
      dhcp-range=192.168.0.0,proxy
      pxe-service=tag:!ipxe,x86-64_EFI,"EFI network boot",ipxe-amd64.efi
      pxe-service=tag:ipxe,x86-64_EFI,"iPXE",proxmox.ipxe
      dhcp-userclass=set:ipxe,iPXE
      enable-tftp
      tftp-root="/home/{{ ansible_user }}/proxmox-pxe-boot/pxe/tftp"
      log-queries
      log-dhcp
      log-facility=/var/log/dnsmasq.log
    mode: "0640"
  notify: Reload dnsmasq

- name: Dnsmasq acl
  ansible.posix.acl:
    path: "/home/{{ ansible_user }}"
    entity: dnsmasq
    etype: user
    permissions: x
    state: present

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Download iso
  ansible.builtin.get_url:
    url: https://enterprise.proxmox.com/iso/proxmox-ve_9.2-1.iso
    dest: "/home/{{ ansible_user }}/proxmox-pxe-boot/proxmox-ve_9.2-1.iso"
    checksum: sha256:4e88fe416df9b527624a175f24c9aa07c714d3332afb1ee3dbf3879573ef2c6c
    mode: "0644"
    owner: root
    group: root

- name: Prep iso
  ansible.builtin.command:
    argv:
      - proxmox-auto-install-assistant
      - prepare-iso
      - "/home/{{ ansible_user }}/proxmox-pxe-boot/proxmox-ve_9.2-1.iso"
      - --fetch-from
      - http
      - --url
      - "http://192.168.0.18:8000/answer.toml"
      - --pxe
      - --output
      - "/home/{{ ansible_user }}/proxmox-pxe-boot/pxe/http/"
    creates: "/home/{{ ansible_user }}/proxmox-pxe-boot/pxe/http/initrd.img"

- name: Render answer file
  ansible.builtin.template:
    src: templates/answer.toml.j2
    dest: "/home/{{ ansible_user }}/proxmox-pxe-boot/pxe/http/answer.toml"
    mode: "0600"
  no_log: true

- name: Copy ipxe
  ansible.builtin.copy:
    src: '/usr/lib/ipxe/ipxe-amd64.efi'
    dest: "/home/{{ ansible_user }}/proxmox-pxe-boot/pxe/tftp/"
    remote_src: true
    mode: "0644"
    owner: root
    group: root
