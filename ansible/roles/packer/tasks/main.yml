- name: Download hashicorp keyring
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /usr/share/keyrings/packer-key.asc
    mode: "0644"
    owner: root
    group: root

- name: Add hashicorp linux repo
  ansible.builtin.apt_repository:
    repo: >
      deb [arch=amd64 signed-by=/usr/share/keyrings/packer-key.asc]
      https://apt.releases.hashicorp.com
      {{ ansible_facts['distribution_release'] }} main

- name: Install packages
  ansible.builtin.apt:
    name:
      - packer
    state: present
    update_cache: true
    cache_valid_time: 3600
