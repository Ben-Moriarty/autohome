- name: Install python3-debian
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add grafana apt repo
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: https://apt.grafana.com
    suites: [stable]
    components: [main]
    signed_by: https://apt.grafana.com/gpg.key
    state: present
  register: loki_grafana_repo

- name: Install loki
  ansible.builtin.apt:
    name: loki
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create loki group
  ansible.builtin.group:
    name: loki
    system: true

- name: Make sure loki user/group is installed
  ansible.builtin.user:
    name: loki
    group: loki
    create_home: false

- name: Create loki directory
  ansible.builtin.file:
    path: /var/lib/loki
    state: directory
    owner: loki
    group: loki
    mode: "0750"

- name: Deploy loki config
  ansible.builtin.template:
    src: config.yml.j2
    dest: /etc/loki/config.yml
    owner: root
    group: loki
    mode: "0640"
    validate: /usr/bin/loki -config.file=%s -verify-config
  notify: Restart loki
