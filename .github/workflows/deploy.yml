name: Deploy homelab
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Run site playbook
        working-directory: ansible
        run: ansible-playbook site.yml
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
          ANSIBLE_VAULT_PASSWORD_FILE: ./vault_pass.sh